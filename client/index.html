<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Jurassic Park</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="text-center mb-4">
                    <i class="bi bi-bug-fill text-warning" style="font-size: 3rem;"></i>
                    <h1 class="fw-bold">Jurassic Park</h1>
                    <p class="text-secondary">Sistema Central de Gestión</p>
                </div>

                <div class="card bg-light text-dark shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Iniciar Sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Registrarse</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                                <form id="form-login">
                                    <div class="mb-3">
                                        <label for="login-email" class="form-label text-secondary fw-bold">Correo Electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" id="login-email" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="login-password" class="form-label text-secondary fw-bold">Contraseña</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="login-password" required>
                                        </div>
                                    </div>
                                    
                                    <div id="alert-login" class="alert d-none" role="alert"></div>
                                    
                                    <button type="submit" class="btn btn-warning w-100 fw-bold btn-lg">Acceder al Sistema</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="register-pane" role="tabpanel">
                                <form id="form-register">
                                    <div class="mb-3">
                                        <label for="reg-nick" class="form-label text-secondary fw-bold">Usuario (Nick)</label>
                                        <input type="text" class="form-control" id="reg-nick" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="reg-email" class="form-label text-secondary fw-bold">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="reg-email" required>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-6">
                                            <label for="reg-password" class="form-label text-secondary fw-bold">Contraseña</label>
                                            <input type="password" class="form-control" id="reg-password" required>
                                        </div>
                                        <div class="col-6">
                                            <label for="reg-password-conf" class="form-label text-secondary fw-bold">Confirmar</label>
                                            <input type="password" class="form-control" id="reg-password-conf" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="reg-foto" class="form-label text-secondary fw-bold">Foto de perfil (Opcional)</label>
                                        <input type="file" class="form-control" id="reg-foto" accept="image/*">
                                    </div>

                                    <div id="alert-register" class="alert d-none" role="alert"></div>
                                    
                                    <button type="submit" class="btn btn-success w-100 fw-bold btn-lg">Solicitar Acceso</button>
                                </form>
                            </div>

                        </div> </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
