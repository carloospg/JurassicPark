<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Jurassic Park</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/perfil/perfil.css">
</head>
<body class="bg-light">
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-0 rounded-4">
                    
                    <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                        <h3 class="mb-0"><i class="bi bi-person-vcard me-2"></i>Ficha de Personal</h3>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img id="img-preview" src="" alt="Foto de perfil" class="rounded-circle object-fit-cover shadow border border-3 border-primary">
                        </div>

                        <form id="form-perfil">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label text-secondary fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control text-secondary bg-light" id="email" disabled>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label class="form-label text-secondary fw-bold">Rol Asignado</label>
                                    <input type="text" class="form-control text-secondary bg-light" id="rol" disabled>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h5 class="mb-3 text-primary">Datos Modificables</h5>

                            <div class="mb-3">
                                <label for="nick" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="nick" required>
                            </div>

                            <div class="mb-3">
                                <label for="foto" class="form-label">Cambiar Foto de Perfil</label>
                                <input type="file" class="form-control" id="foto" accept="image/*">
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Nueva Contraseña (Opcional)</label>
                                <input type="password" class="form-control" id="password">
                            </div>

                            <div class="mb-4">
                                <label for="password_confirmation" class="form-label">Confirmar Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password_confirmation">
                            </div>

                            <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>
                            <div id="alert-success" class="alert alert-success d-none" role="alert"></div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-4">
                                <a href="/" class="btn btn-outline-secondary fw-bold px-4">
                                    <i class="bi bi-arrow-left me-1"></i> Salir
                                </a>
                                
                                <div>
                                    <button type="button" id="btn-logout" class="btn btn-danger fw-bold px-4 me-2">
                                        <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                                    </button>
                                    <button type="submit" class="btn btn-primary fw-bold px-4">
                                        <i class="bi bi-floppy me-1"></i> Guardar Cambios
                                    </button>
                                </div>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/perfil/perfil.ts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
