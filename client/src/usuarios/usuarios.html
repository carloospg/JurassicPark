<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Personal | Jurassic Park</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/src/usuarios/usuarios.html">
          <i class="bi bi-bug-fill text-warning me-2"></i>Jurassic Park
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a href="/src/panel/panel.html" class="nav-link">
                <i class="bi bi-grid-1x2-fill me-1"></i> Panel
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/src/usuarios/usuarios.html"
                ><i class="bi bi-people-fill me-1"></i> Personal</a
              >
            </li>
          </ul>

          <div class="d-flex align-items-center">
            <img
              id="nav-user-foto"
              src=""
              alt="Foto"
              class="rounded-circle me-2 object-fit-cover border border-secondary"
              style="width: 38px; height: 38px; display: none"
            />

            <div class="dropdown">
              <button
                class="btn btn-dark dropdown-toggle border-0"
                type="button"
                id="nav-user-name"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Cargando...
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                <li>
                  <a class="dropdown-item" href="/src/perfil/perfil.html"
                    ><i class="bi bi-person-badge me-2 text-primary"></i>Mi
                    Perfil</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <button
                    class="dropdown-item text-danger fw-bold"
                    id="btn-logout-nav"
                  >
                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div
        class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3"
      >
        <h2 class="fw-bold text-dark mb-0">
          <i class="bi bi-card-heading me-2"></i>Directorio de Personal
        </h2>
      </div>

      <div id="alerta-general" class="alert d-none" role="alert"></div>

      <div class="row g-4" id="grid-usuarios">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="text-secondary mt-2">
            Conectando con la base de datos central...
          </p>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalEditarRol"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">
              <i class="bi bi-shield-lock me-2"></i>Modificar Permisos
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p>
              Selecciona el nuevo rol para
              <strong id="modal-nombre-empleado"></strong>:
            </p>
            <input type="hidden" id="modal-id-empleado" />
            <select class="form-select" id="select-nuevo-rol">
              <option value="Administrador">Administrador</option>
              <option value="Veterinario">Veterinario</option>
              <option value="Mantenimiento">Mantenimiento</option>
            </select>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-primary" id="btn-guardar-rol">
              Guardar Cambios
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/usuarios/usuarios.ts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
