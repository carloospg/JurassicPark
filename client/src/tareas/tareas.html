<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas | Jurassic Park</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/src/navbar/navbar.css" />
    <link rel="stylesheet" href="/src/tareas/tareas.css" />
  </head>
  <body class="bg-light">
    <div id="navbar-container"></div>

    <div class="container-fluid py-4 px-4">
      <div
        class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3"
      >
        <div>
          <h2 class="fw-bold text-dark mb-0">
            <i class="bi bi-clipboard-check me-2"></i>Tareas
          </h2>
          <p class="text-secondary mb-0 small" id="subtitulo-tareas">
            Lista de tareas del parque
          </p>
        </div>
        <button class="btn btn-warning fw-bold" id="btn-nueva-tarea">
          <i class="bi bi-plus-lg me-1"></i> Nueva Tarea
        </button>
      </div>

      <div class="d-flex gap-2 mb-4 flex-wrap">
        <button
          class="btn btn-warning btn-sm fw-bold filtro-estado active"
          data-estado=""
        >
          Todas
        </button>
        <button
          class="btn btn-outline-warning btn-sm fw-bold filtro-estado"
          data-estado="Pendiente"
        >
          Pendiente
        </button>
        <button
          class="btn btn-outline-primary btn-sm fw-bold filtro-estado"
          data-estado="En progreso"
        >
          En progreso
        </button>
        <button
          class="btn btn-outline-success btn-sm fw-bold filtro-estado"
          data-estado="Finalizada"
        >
          Finalizada
        </button>
      </div>

      <div class="row g-3" id="grid-tareas">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-warning" role="status"></div>
          <p class="text-secondary mt-2">Cargando tareas...</p>
        </div>
      </div>
    </div>

    <!-- MODAL DETALLE / CREAR / EDITAR TAREA -->
    <div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title" id="modal-tarea-titulo">Tarea</h5>
          </div>
          <div class="modal-body">
            <input type="hidden" id="tarea-id" />

            <div class="mb-3">
              <label class="form-label fw-bold">Tipo de tarea</label>
              <input
                type="text"
                class="form-control"
                id="tarea-tipo"
                placeholder="Ej: Revision veterinaria..."
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Estado</label>
              <select class="form-select" id="tarea-estado">
                <option value="Pendiente">Pendiente</option>
                <option value="En progreso">En progreso</option>
                <option value="Finalizada">Finalizada</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Celda</label>
              <select class="form-select" id="tarea-celda"></select>
              <a
                href="#"
                id="link-ver-celda"
                class="d-none text-decoration-none mt-1 d-inline-block"
              >
                <i class="bi bi-map me-1"></i>
                <span id="texto-celda-link"></span>
              </a>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Empleados asignados</label>
              <select
                class="form-select"
                id="tarea-usuarios"
                multiple
                size="4"
              ></select>
              <small class="text-muted"
                >Manten Ctrl para seleccionar varios</small
              >
            </div>

            <div id="alert-modal-tarea" class="alert d-none"></div>
          </div>

          <div class="modal-footer d-flex justify-content-between">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              <i class="bi bi-arrow-left me-1"></i> Cerrar
            </button>
            
            <button
              type="button"
              class="btn btn-primary fw-bold d-none"
              id="btn-avanzar-estado-modal"
            >
              Iniciar tarea <i class="bi bi-arrow-right ms-1"></i>
            </button>

            <div id="botones-admin-tarea" class="d-flex gap-2 d-none">
              <button
                type="button"
                class="btn btn-danger"
                id="btn-eliminar-tarea-modal"
              >
                <i class="bi bi-trash"></i>
              </button>
              <button
                type="button"
                class="btn btn-warning fw-bold"
                id="btn-guardar-tarea"
              >
                <i class="bi bi-floppy"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL CONFIRMAR BORRADO -->
    <div
      class="modal fade"
      id="modalConfirmarBorradoTarea"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>Eliminar Tarea
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center">
            <p class="mb-1">Esta accion no se puede deshacer</p>
          </div>
          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger fw-bold"
              id="btn-confirmar-borrado-tarea"
            >
              <i class="bi bi-trash me-1"></i> Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/tareas/tareas.ts"></script>
  </body>
</html>
