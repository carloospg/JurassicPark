<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Jurassic Park</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4">
                    
                    <div class="card-header bg-success text-white text-center py-3 rounded-top-4">
                        <h3 class="mb-0"><i class="bi bi-person-badge me-2"></i>Registro de Personal</h3>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="form-registro">
                            <div class="mb-3">
                                <label for="nick" class="form-label">Usuario (Nick)</label>
                                <input type="text" class="form-control" id="nick" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electronico</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Contrasena</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password_confirmation" class="form-label">Confirmar Contrasena</label>
                                <input type="password" class="form-control" id="password_confirmation" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="foto" class="form-label">Foto de Perfil (Opcional)</label>
                                <input type="file" class="form-control" id="foto" accept="image/*">
                            </div>

                            <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>
                            <div id="alert-success" class="alert alert-success d-none" role="alert"></div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">Registrar</button>
                                <a href="/" class="btn btn-outline-secondary">Volver al Inicio</a>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/registro/registro.ts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
